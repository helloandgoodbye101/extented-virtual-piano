        .black { width: 28px; height: 140px; background: #111 !important; margin-left: -14px; margin-right: -14px; z-index: 2; border-radius: 0 0 3px 3px; }
        .black.active { background: #ff007f !important; box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.7); }
        @media screen and (orientation: landscape) { .white { height: 110px; } .black { height: 70px; } }
    </style>
</head>

    const keys = document.querySelectorAll('.key');
    let audioCtx;
    
    const freqMap = {

        "C4": 261.63, "C#4": 277.18, "D4": 293.66, "D#4": 311.13, "E4": 329.63,

        "D#5": 622.25, "E5": 659.25 
    };

    function playPianoNote(frequency) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.frequency.value = frequency;
        osc.type = 'triangle'; 
        
        gainNode.gain.setValueAtTime(1.0, now);
        
        gainNode.gain.linearRampToValueAtTime(0.8, now + 0.05);
        // CHANGED: Sustain is now exactly 1.5 seconds
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        
        osc.start(now);
        // CHANGED: Stop time is now 1.5 seconds
        osc.stop(now + 1.5);
    }

    function startNote(e) {
        const key = e.currentTarget;
        if(!key.classList.contains('active')) {
            key.classList.add('active');
            playPianoNote(freqMap[key.dataset.note]);
        }
    }

    function endNote(e) {
        e.currentTarget.classList.remove('active');
    }
